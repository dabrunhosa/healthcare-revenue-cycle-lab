name: Verify revenue cycle
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test RevenueCycle.slnx --configuration Release --disable-build-servers -m:1
      - run: pwsh -File scripts/smoke.ps1
      - run: docker compose build
